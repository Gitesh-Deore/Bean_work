# ===== ONLY EDIT THE SQL IN THIS FILE =====
# Rules:
#  - Use named params only: :appId (application id) and :uid (logged-in user id)
#  - Each query must return ONE row
#  - Keep the column ALIASES exactly as below (the payload builder reads these keys)

# Needs aliases: BRANCH_CODE, CIF_NUMBER, CHANNEL_ID, SOURCE_ID, REL_ID
cersai.query.application=SELECT BRANCH_CODE AS BRANCH_CODE, CIF_NUMBER AS CIF_NUMBER, CHANNEL_ID AS CHANNEL_ID, SOURCE_ID AS SOURCE_ID, REL_ID AS REL_ID FROM CKYC_APPLICATION WHERE APPLICATION_ID = :appId

# Needs aliases: EMP_NAME, EMP_CODE, DESIGNATION, BRANCH_NAME, EMP_CKYC_ID
cersai.query.employee=SELECT EMP_NAME AS EMP_NAME, EMP_CODE AS EMP_CODE, DESIGNATION AS DESIGNATION, BRANCH_NAME AS BRANCH_NAME, EMP_CKYC_ID AS EMP_CKYC_ID FROM EMPLOYEE_MASTER WHERE USER_ID = :uid

# Optional: add more queries here, then list the key in cersai.query.keys (comma separated)
cersai.query.keys=cersai.query.application,cersai.query.employee

# Insert audit row. Params: :appId :ref :resp
cersai.query.audit=INSERT INTO CERSAI_AUDIT (APPLICATION_ID, REQ_REF_NO, RESPONSE, CREATED_ON) VALUES (:appId, :ref, :resp, SYSDATE)

# CERSAI endpoint
cersai.api.url=https://<cersai-host>/<path>
